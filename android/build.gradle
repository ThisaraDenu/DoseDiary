allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    // Fix JVM target mismatch in all Android subproject plugins (e.g. shared_preferences_android,
    // flutter_timezone) that hardcode Java 11 but have Kotlin at a different target.
    // afterEvaluate runs AFTER the subproject's build.gradle is processed, so our override wins.
    afterEvaluate { project ->
        def androidExt = project.extensions.findByName('android')
        if (androidExt != null) {
            androidExt.compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
        }
        project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile).configureEach {
            compilerOptions {
                jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
            }
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects { project ->
    if (project.name != "app") {
        project.ext.flutter = [
            compileSdkVersion: 34,
            minSdkVersion: 21,
            targetSdkVersion: 34
        ]
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
