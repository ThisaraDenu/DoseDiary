name: dose_diary
description: DoseDiary — medication reminder and adherence tracking.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Supabase Auth + DB
  supabase_flutter: ^2.6.0
  google_sign_in: ^6.2.1

  # Local notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # Google Fonts
  google_fonts: ^8.2.1

  # Firebase (FCM push for caregiver alerts)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Date/time utilities
  intl: ^0.20.3

  # Calendar widget
  table_calendar: ^3.1.2

  # Shared preferences (for onboarding completion flag)
  shared_preferences: ^2.3.2

  # UUID generation
  uuid: ^4.5.0

  # Collection helpers
  collection: ^1.18.0

  # Cupertino icons
  cupertino_icons: ^1.0.8

  # SQLite Local Database
  sqflite: ^2.3.3+1
  path: ^1.9.0
  app_links: ^6.4.1
  image_picker: ^1.2.3
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  json_serializable: ^6.8.0
  mockito: ^5.4.4
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  generate: true
